# Publishes the article (report/index.qmd) to GitHub Pages:
#   https://johnpospisil.github.io/wikipedia-ai-overviews/
# Built from the committed outputs (report/qa, report/figures, data/reference), so the raw dumps
# are not needed. Runs only once the repository is public (Pages needs a public repo on the free
# plan); enable it under Settings > Pages > Source: GitHub Actions.
name: pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    if: ${{ !github.event.repository.private }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
          enable-cache: true
      - run: uv sync --frozen
      - uses: quarto-dev/quarto-actions/setup@v2
        with:
          version: 1.10.19
      - name: Render the article
        run: make report
      - name: Assemble the site
        run: |
          mkdir -p _site
          cp report/index.html _site/index.html
          touch _site/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
